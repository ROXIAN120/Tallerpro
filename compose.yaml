services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tallerpro-app
    container_name: tallerpro-app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=taller_db
      - DB_USERNAME=sail
      - DB_PASSWORD=password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: tallerpro-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=taller_db
      - MYSQL_USER=sail
      - MYSQL_PASSWORD=password
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_ALLOW_EMPTY_PASSWORD=1
    ports:
      - "3306:3306"
    volumes:
      - tallerpro-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${MYSQL_ROOT_PASSWORD}"]
      retries: 3
      timeout: 5s

volumes:
  tallerpro-mysql-data:
